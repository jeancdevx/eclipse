services:
  postgres:
    image: postgres:17.10
    container_name: eclipse-postgres
    environment:
      POSTGRES_USER: eclipse
      POSTGRES_PASSWORD: eclipse
      POSTGRES_DB: eclipse
    ports:
      - '5432:5432'
    volumes:
      - eclipse_pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U eclipse']
      interval: 5s
      timeout: 5s
      retries: 10

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    container_name: eclipse-azurite
    command: azurite-blob --blobHost 0.0.0.0 --blobPort 10000
    ports:
      - '10000:10000'
    volumes:
      - eclipse_azurite:/data

  mc:
    image: itzg/minecraft-server:2026.7.2
    container_name: eclipse-mc
    tty: true
    stdin_open: true
    ports:
      - '25565:25565'
      - '25575:25575'
    env_file:
      - ./data/.eclipse-runtime.env
    environment:
      EULA: 'TRUE'
      USE_AIKAR_FLAGS: 'TRUE'
      ENABLE_RCON: 'true'
      RCON_PASSWORD: ${RCON_PASSWORD:-eclipse}
      RCON_PORT: 25575
    volumes:
      - ./data/active:/data
    restart: on-failure:3

volumes:
  eclipse_pg:
  eclipse_azurite:
