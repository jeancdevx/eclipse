services:
  mc:
    image: itzg/minecraft-server:2026.7.2
    container_name: eclipse-mc
    tty: true
    stdin_open: true
    ports:
      - '25565:25565'
      - '25575:25575'
    env_file:
      - ./data/.eclipse-runtime.env
    environment:
      EULA: 'TRUE'
      USE_AIKAR_FLAGS: 'TRUE'
      ENABLE_RCON: 'true'
      RCON_PASSWORD: ${RCON_PASSWORD:-eclipse}
      RCON_PORT: 25575
      ENABLE_AUTOPAUSE: 'FALSE'
    volumes:
      - ./data/active:/data
    restart: on-failure:3
