# Guest VM compose — used by cloud-init on the Azure game VM.
# Active instance path is swapped by the control plane before start.

services:
  mc:
    image: itzg/minecraft-server:2026.7.2
    container_name: eclipse-mc
    tty: true
    stdin_open: true
    network_mode: host
    env_file:
      # Relative to this compose file. With DOCKER_HOST=ssh:// the compose
      # *client* (control-plane API) must have this file locally; the host
      # also stages it under /var/lib/eclipse on the game VM for operators.
      - .eclipse-runtime.env
    environment:
      EULA: 'TRUE'
      USE_AIKAR_FLAGS: 'TRUE'
      ENABLE_RCON: 'true'
      RCON_PASSWORD: ${RCON_PASSWORD}
      RCON_PORT: 25575
      ONLINE_MODE: 'TRUE'
    volumes:
      - /var/lib/eclipse/active:/data
    restart: on-failure:5
